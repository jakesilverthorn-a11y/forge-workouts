<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the app use the whole iPhone screen; the CSS below keeps it clear of the notch and home bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Forge - Smart Workout Planner</title>
    <meta name="description" content="A smart workout planner that adapts each day's workout to how recovered your muscles are." />
    <meta name="theme-color" content="#17191d" />

    <!-- Add to Home Screen on iPhone: opens full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forge" />
    <meta name="format-detection" content="telephone=no" />
    <link data-trunk rel="copy-dir" href="assets" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="icon" type="image/png" href="assets/icon-192.png" />
    <link rel="manifest" href="assets/manifest.json" />

    <!-- Trunk compiles the Rust app to WebAssembly and links it here. -->
    <link data-trunk rel="rust" data-wasm-opt="2" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Matches the app's top and tab bars, so the strips behind the notch and home bar blend in. */
            background: #17191d;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            position: absolute;
            top: env(safe-area-inset-top, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: env(safe-area-inset-left, 0px);
            width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            outline: none;
        }
        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #c8ccd4;
            font: 16px -apple-system, system-ui, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div id="loading_text"><p>Loading Forge…</p></div>
</body>
</html>
